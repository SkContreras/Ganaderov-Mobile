name: Flutter checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
      - name: Install system SQLite for Linux tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev sqlite3
          sqlite3 --version
          ldconfig -p | grep 'libsqlite3.so'
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
